name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-v1

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Put Godot on the path
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Show Godot version
        run: godot --version

      - name: Import project
        run: godot --headless --path . --import

      - name: Unit tests
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Scene smoke test
        run: godot --headless --path . --script res://tests/smoke_scenes.gd

      - name: Export Windows build
        run: |
          mkdir -p builds/windows
          godot --headless --path . --export-release "Windows Desktop" builds/windows/Trailomon.exe
          test -s builds/windows/Trailomon.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Trailomon-windows
          path: builds/windows/
          retention-days: 14
