name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # Write access is only used by the "Publish latest build" step on main.
    permissions:
      contents: write
    # Never let two publishes to the "latest" release overlap.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-v1

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Put Godot on the path
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Show Godot version
        run: godot --version

      - name: Import project
        run: godot --headless --path . --import

      - name: Unit tests
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Scene smoke test
        run: godot --headless --path . --script res://tests/smoke_scenes.gd

      - name: Export Windows build
        run: |
          mkdir -p builds/windows
          godot --headless --path . --export-release "Windows Desktop" builds/windows/Trailomon.exe
          test -s builds/windows/Trailomon.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Trailomon-windows
          path: builds/windows/
          retention-days: 14

      # Every push to main replaces the files on the "latest" GitHub Release.
      # The desktop launcher downloads version.txt from there, and fetches
      # Trailomon.exe only when that version has changed.
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_SHA" > builds/version.txt
          notes="Newest Windows build, made automatically from commit $GITHUB_SHA."
          if gh release view latest >/dev/null 2>&1; then
            # The exe goes up first, so version.txt never names a build that isn't there yet.
            gh release upload latest builds/windows/Trailomon.exe --clobber
            gh release upload latest builds/version.txt --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest builds/windows/Trailomon.exe builds/version.txt \
              --title "Latest build" --notes "$notes" --target "$GITHUB_SHA" --latest
          fi
